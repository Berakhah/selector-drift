[project]
name = "selector-drift"
version = "0.1.0"
description = "Self-healing extraction for business systems with no API."
requires-python = ">=3.12"
license = "Apache-2.0"
# bok-core is not on PyPI yet (P-1), so it is vendored as a pre-built wheel in vendor/ and
# referenced by a repo-relative path in [tool.uv.sources] below. A relative path to a built
# wheel works from any checkout and inside the worker and bench-scorer images (both
# Dockerfiles COPY vendor before `uv sync --frozen`); the earlier editable absolute path into
# a sibling repo did not exist inside a container.
# Source: backoffice-kit branch bok-core-minimal, commit 3a4044d. vendor/README.md records
# the exact build command and the wheel sha256, and how to refresh it.
# Switching to PyPI later: delete vendor/, change the dependency to `bok-core==<version>`,
# remove the bok-core entry from [tool.uv.sources], then `uv lock`.
dependencies = [
    "alembic>=1.19.1",
    "argon2-cffi>=25.1.0",
    "bok-core",
    "croniter>=6.2.4",
    "cryptography>=50.0.1",
    "cssselect>=1.5.0",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "numpy>=2.5.2",
    "playwright==1.62.0",  # B8: exact, with the chromium revision below; see tests/test_pins.py
    "prefect>=3.8.4",
    "psycopg[binary]>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "python-ulid>=4.0.1",
    "pyyaml>=6.0.3",
    "regex>=2026.7.19",
    "sqlalchemy>=2.0.52",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "import-linter>=2.14",
    "lxml-stubs>=0.5.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "pytest-playwright>=0.9.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
    "types-croniter>=6.2.4.20261006",
    "types-pyyaml>=6.0.12.20260906",
    "types-regex>=2026.9.10.20260911",
]
testbench = [
    "fastapi>=0.141.1",
    "itsdangerous>=2.2.0",
    "jinja2>=3.1.6",
    "lxml>=6.1.2",
    "python-multipart>=0.0.32",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# testbench.portal is a Python package (server-rendered FastAPI + Jinja2, bench spec §1) as
# of 2026-09-26 -- no exclusion here; it packages normally under testbench.
packages = ["selector_drift", "testbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 formats fenced ```python blocks inside Markdown by default -- scope both
# check and format to the code this repo actually owns, not the plan/spec docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# bok-core is the vendored wheel described above (P-1) -- it ships no
# py.typed marker yet, so mypy --strict cannot see its inline types at all without this.
# `follow_untyped_imports` (not `ignore_missing_imports`, fix round 1, I-3): the latter makes
# every name imported from bok_core resolve to `Any`, silently defeating strict checking on
# anything that touches `Sensitivity`. `follow_untyped_imports` instead has mypy read
# bok_core's own (fully annotated, just unmarked) source and use its real types.
module = "bok_core.*"
follow_untyped_imports = true

[[tool.mypy.overrides]]
# pyarrow ships no type information (Task 28).
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: no external dependencies -- no browser, no Postgres, no network",
    "integration: may touch Postgres, the lake, or a local bench fixture",
    "e2e: a real browser and a served UI -- unbounded runtime, CI only",
]

[tool.selector-drift]
# Printed by `uv run playwright install --with-deps chromium`: Chrome for Testing
# 151.0.7922.34, playwright chromium build v1234 (installed to
# ms-playwright/chromium-1234). B8: an unpinned browser turns a UI-change test into a
# browser-change test.
playwright_chromium_revision = "1234"

[tool.uv]
default-groups = ["dev", "testbench"]

[tool.uv.sources]
bok-core = { path = "vendor/bok_core-0.0.1-py3-none-any.whl" }
