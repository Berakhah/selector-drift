[project]
name = "selector-drift"
version = "0.1.0"
description = "Self-healing extraction for business systems with no API."
requires-python = ">=3.12"
license = "Apache-2.0"
# TEMPORARY: bok-core is not on PyPI yet (P-1). A git dependency on the bok-core-minimal
# branch was tried first and hit a reproducible uv 0.11.21 panic on any git+file:// URL
# with a pinned ref (AmbiguousAuthority in crates/uv-pypi-types/src/parsed_url.rs, not a
# path-encoding issue -- see .superpowers/sdd/2024-11-07-selector-drift/task-1-report.md).
# Using an editable path dependency into the sibling backoffice-kit repo's own
# .worktrees/bok-core-minimal worktree instead -- sidesteps git-URL parsing entirely and
# needs no pinned ref, at the cost of depending on a worktree that lives outside this repo.
# The path below is ABSOLUTE, not relative, on purpose (code review finding): a relative
# path is resolved from pyproject.toml's own directory, so `../../../../` only lands on
# `backoffice-kit/` from inside this nested .claude/worktrees/ checkout -- from the real
# repo root after this branch merges, the same `../../../../` overshoots past the repo's
# drive root. An absolute path is correct from any checkout of this repo but is NOT
# portable across machines (it hardcodes this machine's path to the sibling repo).
# Unblocked by either: the bok-core-minimal branch merging to backoffice-kit's main, or a
# real PyPI release -- switch this source back to a normal PyPI dependency at that point.
dependencies = [
    "alembic>=1.19.1",
    "bok-core",
    "cryptography>=50.0.1",
    "duckdb>=1.5.5",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "lxml>=6.1.2",
    "numpy>=2.5.2",
    "playwright>=1.62.0",
    "prefect>=3.8.4",
    "psycopg>=3.3.4",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.52",
]

[dependency-groups]
dev = [
    "hypothesis>=6.165.10",
    "import-linter>=2.14",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-httpx>=0.36.2",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# testbench.portal is a Python package (server-rendered FastAPI + Jinja2, bench spec §1) as
# of 2026-09-26 -- no exclusion here; it packages normally under testbench.
packages = ["selector_drift", "testbench"]

[tool.ruff]
line-length = 100
target-version = "py312"
# ruff 0.16 formats fenced ```python blocks inside Markdown by default -- scope both
# check and format to the code this repo actually owns, not the plan/spec docs.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# tests/test_import_contracts.py is copied verbatim from the plan (already audited) --
# SIM115 (context manager for open()) is a style nit, not worth diverging from that text.
# Narrowed to this one file (not "tests/**") since no other test file uses bare open().
"tests/test_import_contracts.py" = ["SIM115"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# bok-core is the sibling editable path dependency described above (P-1) -- it ships no
# py.typed marker yet, so mypy --strict cannot see its inline types at all without this.
# `follow_untyped_imports` (not `ignore_missing_imports`, fix round 1, I-3): the latter makes
# every name imported from bok_core resolve to `Any`, silently defeating strict checking on
# anything that touches `Sensitivity`. `follow_untyped_imports` instead has mypy read
# bok_core's own (fully annotated, just unmarked) source and use its real types.
module = "bok_core.*"
follow_untyped_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: no external dependencies -- no browser, no Postgres, no network",
    "integration: may touch Postgres, the lake, or a local bench fixture",
    "e2e: a real browser and a served UI -- unbounded runtime, CI only",
]

[tool.selector-drift]
# Printed by `uv run playwright install --with-deps chromium`: Chrome for Testing
# 151.0.7922.34, playwright chromium build v1234 (installed to
# ms-playwright/chromium-1234). B8: an unpinned browser turns a UI-change test into a
# browser-change test.
playwright_chromium_revision = "1234"

[tool.uv.sources]
bok-core = { path = "D:/Project/Portifolio Projects/Upwork_Projects/backoffice-kit/.worktrees/bok-core-minimal", editable = true }
