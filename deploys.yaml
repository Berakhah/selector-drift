# deploys.yaml -- where each target's deploy history comes from (M10). Read by
# selector_drift/orchestrate/deploys.py; path overridable with SD_DEPLOYS_FILE.
testbench:
  source: self-host
  # Appended by the VM's deploy script, one JSON line per deploy. Under the worker's writable
  # /data volume (the rootfs is read-only); a relative path resolves against this file's directory.
  path: /data/deploys/testbench.jsonl
# The two control-arm targets are added here when P-3 names them, as either
#   <name>: { source: self-host, path: /data/deploys/<name>.jsonl }
# or
#   <name>: { source: gh-actions, repo: <real-account>/<repo>, environment: production }
