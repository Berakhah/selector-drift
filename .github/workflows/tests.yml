name: tests
on:
  push:
    branches: [ main ]
  pull_request:
# Least privilege (S-I3): read the repo, write nothing back.
permissions:
  contents: read
# A newer push to the same ref makes the older run's result irrelevant.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true
env:
  # Both Dockerfiles pin uv 0.11.21; CI uses the same one. --frozen: the lock is the contract, a
  # CI run must never re-resolve it.
  UV_FROZEN: "1"
  PYTHONUNBUFFERED: "1"
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # Pinned to commit SHAs, not mutable tags (S-I4). Trailing comment names the tag.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy --strict selector_drift
      # Every architecture contract, including api-is-read-side and the scope/credential walls.
      - run: uv run lint-imports

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync
      # `unit` means no browser, no Postgres, no network (pyproject markers), so this job gets none.
      #
      # TEMPORARY DESELECT -- remove it when the ninety-day-log targets are decided (00 §12 Q1)
      # and scopes/*.yaml carry real values. That test is the guard that refuses to start a run
      # against an unsigned scope record; while the records are still templates it cannot pass.
      # It is deselected by node id, loudly, rather than skipped in the test file, so the guard
      # stays armed everywhere else (a local run still fails on it, which is the point).
      - run: >-
          uv run pytest -m unit -n auto -q
          --deselect tests/scope/test_records_load.py::test_no_scope_record_carries_an_unresolved_placeholder

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.11.21"
          enable-cache: true
      - run: uv sync
      # No credential lives in the repo, fixtures included: the password is generated for this
      # run, masked in the log, and the container dies with the runner. The database is named
      # `*_test`, which tests/conftest.py requires before it will touch Postgres at all.
      - name: Start Postgres with a throwaway password
        run: |
          pw="$(python3 -c 'import secrets; print(secrets.token_urlsafe(24))')"
          echo "::add-mask::$pw"
          docker run -d --name pg -p 127.0.0.1:5432:5432 \
            -e POSTGRES_USER=selector_drift -e POSTGRES_DB=selector_drift_test \
            -e POSTGRES_PASSWORD="$pw" postgres:16-alpine
          echo "SD_DATABASE_URL=postgresql+psycopg://selector_drift:${pw}@127.0.0.1:5432/selector_drift_test" >> "$GITHUB_ENV"
          for i in $(seq 1 30); do
            docker exec pg pg_isready -U selector_drift -d selector_drift_test && exit 0
            sleep 2
          done
          docker logs pg
          exit 1
      # Ten of these tests drive a real Chromium (tests/browser/test_driver.py).
      - run: uv run playwright install --with-deps chromium
      # Each xdist worker provisions and migrates its own database (tests/conftest.py).
      - run: uv run pytest -m integration -n auto -q
      # e2e (-m e2e, 63 tests, "unbounded runtime") is deliberately not here yet.
