name: release

# Creates a GitHub Release with the matching CHANGELOG.md section as its notes, and refuses unless
# the commit already has a green run of the test workflow. Write permission is granted here and
# nowhere else.
#
# Two ways to cut a release, after merging to main through a green PR:
#   - push a tag:  git tag -a v0.1.0 -m "v0.1.0" <merge-commit> && git push origin v0.1.0
#   - or run this workflow from the Actions tab on main with version 0.1.0; it tags main's head.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v (for example 0.1.0)
        required: true

permissions:
  contents: write  # create the release
  actions: read    # look up the test workflow's result for the tagged commit

env:
  # A pushed tag names itself; a manual run takes the version input and tags this commit.
  TAG: ${{ github.event_name == 'workflow_dispatch' && format('v{0}', inputs.version) || github.ref_name }}
  TEST_WORKFLOW: tests.yml

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Tests passed on this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$TEST_WORKFLOW" \
                --commit "$GITHUB_SHA" --status success --json databaseId --jq 'length')"
          if [ "${n:-0}" -lt 1 ]; then
            echo "::error::No successful $TEST_WORKFLOW run for $GITHUB_SHA. Tag a commit that merged through a green PR."
            exit 1
          fi

      - name: A manual run releases main only
        if: github.event_name == 'workflow_dispatch'
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "::error::Run this from main, not $GITHUB_REF."; exit 1; }
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::version must look like 1.2.3, got ${TAG#v}."; exit 1; }

      - name: Notes from CHANGELOG.md
        run: |
          version="${TAG#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no '## [$version]' section. Add it before tagging."
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            # Creates the tag at exactly the commit whose tests were checked above.
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA"
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md --verify-tag
          fi
