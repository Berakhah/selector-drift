services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selector_drift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_local_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-selector_drift}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selector_drift}"]
      interval: 5s
      timeout: 5s
      retries: 10

# Task 4 adds the `worker` service (Playwright, containerised) here -- not this task's job.

volumes:
  postgres_data:
