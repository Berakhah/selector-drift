services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selector_drift}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env -- see .env.example}
      POSTGRES_DB: ${POSTGRES_DB:-selector_drift}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selector_drift}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Prefect's own state (schedules, flow-run history) lives in the same Postgres instance, in
  # its own database (created by docker/postgres-init/10-prefect-database.sql), so a host
  # restart loses no schedule (design 9.2, B3).
  prefect-server:
    image: prefecthq/prefect:3.8.4-python3.12      # matches pyproject's prefect pin; multi-arch
    restart: unless-stopped
    command: [ "prefect", "server", "start", "--host", "0.0.0.0" ]
    environment:
      PREFECT_API_DATABASE_CONNECTION_URL: postgresql+asyncpg://${POSTGRES_USER:-selector_drift}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env -- see .env.example}@postgres:5432/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: http://127.0.0.1:4200/api
      TZ: UTC
    ports: [ "127.0.0.1:4200:4200" ]                # UI over an SSH tunnel only
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health')" ]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      postgres: { condition: service_healthy }

  # The browser worker (Task 4, B8). `serve()` -- a process runner, not a Docker work pool -- so
  # the enforcement lives on THIS container (mem_limit/pids_limit) and is also declared as
  # job_variables on each deployment (Task 6, deployments.py): test_deployments pins that the
  # two never disagree. Limits must match selector_drift/browser/limits.py.
  #
  # Seccomp (H1): option 2 of the Task 4 brief, chosen deliberately. Docker's DEFAULT seccomp
  # profile applies -- there is no `seccomp=` line, and never `seccomp=unconfined`, which would
  # remove the filter on the one container that renders hostile HTML. The default profile
  # denies what Chromium's own sandbox needs, so Chromium runs with --no-sandbox
  # (SD_CHROMIUM_NO_SANDBOX=1, read by browser/driver.py), leaning on the container boundary:
  # cap_drop ALL, no-new-privileges, read-only rootfs, non-root uid, and a single-purpose
  # container whose egress the driver's allowlist confines to the scope record's origins.
  worker:
    build: .
    restart: unless-stopped
    command: [ "python", "-m", "selector_drift.orchestrate.deployments" ]
    init: true                # PID 1 reaps zombie Chromium processes (B8)
    read_only: true
    user: "10001:10001"
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    tmpfs: [ "/tmp", "/home/app/.cache" ]
    shm_size: 1g              # Chromium's default /dev/shm in Docker is 64 MB
    mem_limit: 2g
    pids_limit: 512
    volumes:
      # The one writable path on a read-only rootfs (found 2026-09-26: rung 5's escalation
      # corpus, the lake, evidence and injected sessions had nowhere to go). Owned by uid 10001.
      - sd_data:/data
    environment:
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers   # baked at build, readable by uid 10001
      SD_CHROMIUM_NO_SANDBOX: "1"
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_HOME: /tmp/prefect                 # the rootfs is read-only
      SD_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-selector_drift}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env -- see .env.example}@postgres:5432/${POSTGRES_DB:-selector_drift}
      SD_SPEC_DIR: /app/specs
      SD_SCOPE_DIR: /app/scopes
      SD_LAKE_ROOT: /data/lake
      SD_EVIDENCE_ROOT: /data/evidence
      SD_REDACTION_KEY: ${SD_REDACTION_KEY:?set SD_REDACTION_KEY in .env -- see .env.example}
      SD_SESSION_DIR: /data/sessions
      SD_ESCALATION_CORPUS: /data/corpus/escalations
      SD_ALERT_WEBHOOK_URL: ${SD_ALERT_WEBHOOK_URL:-}
      SD_DEPLOYS_FILE: /app/deploys.yaml       # Task 29A: each target's deploy feed
      SD_GITHUB_TOKEN: ${SD_GITHUB_TOKEN:-}     # optional; gh-actions feeds only
      TZ: UTC
    depends_on:
      postgres: { condition: service_healthy }
      prefect-server: { condition: service_healthy }

  # The mutating claims portal (Tasks 7-11A) -- the treatment arm of the ninety-day log and the
  # artifact a buyer checks the claims against. Built on the P-4 VM, where linux/arm64 is
  # native (the free Oracle shape is Ampere); CI proves the arm64 build under QEMU on every
  # change (.github/workflows/testbench-image.yml). Not published directly: Caddy is the one
  # TLS-terminating front door for the bench's single scope origin (Task 12).
  testbench:
    build:
      context: .
      dockerfile: testbench/Dockerfile
    read_only: true
    user: "10001:10001"
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    tmpfs: [ "/tmp" ]
    mem_limit: 256m
    pids_limit: 128
    environment:
      TESTBENCH_SESSION_SECRET: ${TESTBENCH_SESSION_SECRET:-}
      TESTBENCH_OVERRIDE_SECRET: ${TESTBENCH_OVERRIDE_SECRET:-}
    expose: [ "8080" ]
    restart: unless-stopped

  # The bench scorer (Task 26C): judges each bench heal against the answer key and writes one
  # audit_log row per heal, which is where the false-accept count and the Task 29A alert come
  # from. Its own service because the worker image ships selector_drift/ only (bench spec 2), and
  # the portal image must not import the product. It holds SD_REDACTION_KEY (it matches the
  # redacted seed tag) and reads heal bundles, so: a Postgres role that can read five tables and
  # insert into audit_log and nothing else (alembic 0002), and ONLY the evidence subpath of
  # sd_data, read-only -- the rest of sd_data holds injected client sessions and the lake.
  # The subpath must exist before this starts (spec 7): the volume mount fails otherwise.
  bench-scorer:
    build:
      context: .
      dockerfile: docker/Dockerfile.bench-scorer
    restart: unless-stopped
    command: [ "python", "-m", "testbench.serve_scorer" ]
    init: true
    read_only: true
    user: "10001:10001"
    cap_drop: [ ALL ]
    security_opt:
      - no-new-privileges:true
    tmpfs: [ "/tmp" ]
    mem_limit: 512m
    pids_limit: 128
    volumes:
      - type: volume
        source: sd_data
        target: /data/evidence
        read_only: true
        volume:
          subpath: evidence
    environment:
      PREFECT_API_URL: http://prefect-server:4200/api
      PREFECT_HOME: /tmp/prefect                 # the rootfs is read-only
      SD_DATABASE_URL: postgresql+psycopg://sd_scorer:${SD_SCORER_PASSWORD:?set SD_SCORER_PASSWORD in .env -- see .env.example}@postgres:5432/${POSTGRES_DB:-selector_drift}
      SD_EVIDENCE_ROOT: /data/evidence
      SD_REDACTION_KEY: ${SD_REDACTION_KEY:?set SD_REDACTION_KEY in .env -- see .env.example}
      TZ: UTC
    depends_on:
      postgres: { condition: service_healthy }
      prefect-server: { condition: service_healthy }

  # One reverse proxy, one origin, for both the bench and (Task 34) the API -- the bench's scope
  # record lists exactly one origin, so the browser's allowlist (Task 4, H2) names a single host.
  #
  # S-I1: the highest-exposure container in this stack (the only one with ports bound to
  # 0.0.0.0 on a public VM) gets the same hardening as `testbench`, with one necessary
  # difference. Caddy's official image (caddy:2.8, Debian-based) runs as root with no built-in
  # non-root user, and empirically (verified 2026-10-02 against the real image, both with and
  # without the hardening below) a non-root UID cannot write the `caddy` subdirectory Caddy
  # creates under /data and /config on first run -- `mkdir /data/caddy: permission denied` --
  # because those are fresh Docker-managed volumes Docker itself creates owned by root, and
  # there is no init step here to chown them first. So `user:` stays at the image default
  # (root) per the brief's own fallback ("if it doesn't, keep root but say so"), but
  # `cap_drop: [ALL]` still applies to root too (capabilities gate privileged syscalls
  # independently of UID 0 once ALL is dropped), so `cap_add: [NET_BIND_SERVICE]` is what lets
  # it bind 80/443 at all -- confirmed working end-to-end against the real image with this exact
  # flag set (read-only rootfs, tmpfs /tmp, cap_drop ALL, cap_add NET_BIND_SERVICE,
  # no-new-privileges, named volumes for /data and /config) before this file was written.
  caddy:
    image: caddy:2.8
    ports: [ "80:80", "443:443" ]
    read_only: true
    cap_drop: [ ALL ]
    cap_add: [ NET_BIND_SERVICE ]  # the only capability added; needed to bind 80/443 as root
                                    # once cap_drop: ALL has removed it (see note above)
    security_opt:
      - no-new-privileges:true
    tmpfs: [ "/tmp" ]  # Caddy's own scratch space; /data and /config are the named volumes below
    mem_limit: 256m
    pids_limit: 128
    environment:
      BENCH_HOST: ${BENCH_HOST:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on: [ testbench ]
    restart: unless-stopped

volumes:
  postgres_data:
  sd_data:
  caddy-data:
  caddy-config:
